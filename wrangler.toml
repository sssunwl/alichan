name = "alichan-demo"
main = "src/index.tsx"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "alichan.sssuni.com", custom_domain = true }]

[assets]
directory = "./public"

[vars]
# P0 預覽站:全站 noindex。正式上線(P1)改 "false"
PREVIEW = "true"
SITE_URL = "https://alichan.sssuni.com"
# /cms/dev 開發中工具只俾呢啲電郵（Access app「alichan-dev」同步設定）
DEV_EMAILS = "sssunjp@gmail.com"
# /cms/tools 同 /cms/api 可以用嘅電郵（同 Access policy AliSS 一致）
MEMBER_EMAILS = "ching829520@gmail.com,sssunjp@gmail.com"
# GEMINI_API_KEY 用 wrangler secret put，唔好寫喺度

# 工具箱共用資料（Reel 企劃板、熱搜關注字、對手名單）
[[kv_namespaces]]
binding = "KV"
id = "fb42862dfd974a439da52b047dce0959"
